services:
  - type: web
    name: fake-job-detector-api
    runtime: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt && python train_mock_model.py"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.10.12"
